apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "toolchain.fullname" .}}
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1  # e.g., us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "toolchain.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "toolchain.fullname" .}}
spec:
  secretStoreRef:
    name: {{ include "toolchain.fullname" .}}
    kind: SecretStore
  target:
    name: {{ include "toolchain.fullname" .}}-env
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          checksum/secret: "{{`{{ . | toYaml | sha256sum }}`}}"
  dataFrom:
    - extract:
        key: "/{{.Release.Namespace}}/toolchain/env"
  refreshInterval: 1m
