apiVersion: v1
kind: Service
metadata:
  name: {{ include "toolchain.fullname" . }}
  labels:
    {{- include "toolchain.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
      name: http
  selector:
    {{- include "toolchain.selectorLabels" . | nindent 4 }}
